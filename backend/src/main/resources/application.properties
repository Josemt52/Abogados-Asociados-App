# Default profile (development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server port configuration
server.port=8019

### MySQL configuration (for phpMyAdmin/MySQL server) - DEVELOPMENT
# Set these via environment variables or override in application-{profile}.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/abogados_asociados?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Allow application to start even if the database is not available (disable Hikari fail-fast)
spring.datasource.hikari.initialization-fail-timeout=0

# Multipart upload limits (adjust to your needs)
# Allow up to 10MB per file and request (UI mentions 10 MB max)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=abogados-asociados-secret-key-change-in-production-minimum-256-bits-required-for-security
jwt.expiration=86400000