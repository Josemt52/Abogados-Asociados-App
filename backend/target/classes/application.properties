# Default profile (development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server port configuration
server.port=8019

### MySQL configuration
# SECURITY: Database credentials now loaded from environment variables
# Create a .env file from .env.example and configure with real values
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/abogados_asociados?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Allow application to start even if the database is not available (disable Hikari fail-fast)
spring.datasource.hikari.initialization-fail-timeout=0

# Multipart upload limits (adjust to your needs)
# Allow up to 10MB per file and request (UI mentions 10 MB max)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
# SECURITY: JWT secret now loaded from environment variable
# CRITICAL: In production, set JWT_SECRET to a secure random value (minimum 256 bits)
# Generate with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:abogados-asociados-secret-key-change-in-production-minimum-256-bits-required-for-security}
jwt.expiration=${JWT_EXPIRATION:86400000}